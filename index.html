<!DOCTYPE html>
<html>
<head>
<title>Football AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:#000;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* ICON BAR */

.iconbar{
width:60px;
background:#0b0b0b;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
border-right:1px solid #222;
}

.iconbar span{
font-size:22px;
cursor:pointer;
opacity:0.8;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#0b0b0b;
border-right:1px solid #222;
padding:20px;
overflow-y:auto;
transition:0.3s;
}

.sidebar.collapsed{
width:0;
padding:0;
border:none;
overflow:hidden;
}

.sidebar h2{
margin-bottom:20px;
}

/* SEARCH */

.search{
width:100%;
padding:10px;
background:#161616;
border:none;
border-radius:8px;
color:white;
margin-bottom:12px;
}

/* BUTTONS */

.sidebar button{
background:#161616;
border:none;
color:white;
padding:12px;
border-radius:10px;
cursor:pointer;
margin-bottom:12px;
width:100%;
text-align:left;
}

.sidebar button:hover{
background:#242424;
}

/* CHAT LIST */

.chat-list{
margin-top:20px;
display:flex;
flex-direction:column;
gap:12px;
}

/* CHAT ITEM */

.chat-item{
background:#111;
padding:12px 14px;
border-radius:12px;
display:flex;
justify-content:space-between;
cursor:pointer;
transition:.2s;
}

.chat-item:hover{
background:#1c1c1c;
}

/* MENU */

.menu-btn{
cursor:pointer;
padding:4px;
}

.dropdown{
position:absolute;
background:#1a1a1a;
border:1px solid #333;
border-radius:8px;
display:none;
flex-direction:column;
z-index:999;
}

.dropdown div{
padding:10px;
cursor:pointer;
}

.dropdown div:hover{
background:#333;
}

/* MAIN AREA */

.main{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
padding-top:120px;
overflow:hidden;
position:relative;
max-width:100%;
}

/* HEADER */

.header{
position:absolute;
top:25px;
left:50%;
transform:translateX(-50%);
font-size:20px;
font-weight:600;
opacity:.9;
}

/* CHAT BOX */

.chat-box{
width:100%;
max-width:760px;
height:60vh;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:18px;
padding:10px;
scroll-behavior:smooth;
}

/* MESSAGE */

.message{
padding:14px 18px;
border-radius:16px;
max-width:75%;
font-size:15px;
line-height:1.5;
word-wrap:break-word;
animation:fadeIn 0.2s ease;
}

.user{
background:#2f6fed;
align-self:flex-end;
border-bottom-right-radius:4px;
}

.bot{
background:#161616;
border:1px solid #2a2a2a;
align-self:flex-start;
border-bottom-left-radius:4px;
}

.msg-time{
font-size:11px;
color:#aaa;
margin-top:5px;
text-align:right;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(8px);}
to{opacity:1;transform:translateY(0);}
}

/* PROMPT */

.prompt{
width:100%;
max-width:760px;
background:#111;
border-radius:30px;
padding:14px 18px;
display:flex;
align-items:center;
border:1px solid #2a2a2a;
margin-top:15px;
box-shadow:0 0 0 1px rgba(255,255,255,0.02);
}

.prompt input{
flex:1;
background:transparent;
border:none;
outline:none;
color:white;
font-size:15px;
}

.send{
cursor:pointer;
font-size:20px;
opacity:.8;
}

.send:hover{
opacity:1;
}

/* SUGGESTIONS */
.suggestions{
margin-top:15px;
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
max-width:760px;
}

.suggestion{
background:#111;
border:1px solid #2a2a2a;
padding:10px 16px;
border-radius:24px;
cursor:pointer;
font-size:14px;
transition:all .2s;
}

.suggestion:hover{
background:#1c1c1c;
transform:translateY(-2px);
}

</style>
</head>

<body>

<div class="iconbar">
<span onclick="toggleSidebar()">☰</span>
</div>

<div id="sidebar" class="sidebar">

<h2>⚽ Football AI</h2>

<input id="searchChat" class="search" placeholder="Search chats..." onkeyup="searchChats()">

<button onclick="clearChat()">🆕 New Chat</button>
<button onclick="toggleHistory()">🕘 Chat History</button>

<div id="chatList" class="chat-list"></div>

</div>

<div class="main">

<div class="header">⚽ Football AI</div>

<h1>Where should we start?</h1>

<div id="chat-box" class="chat-box"></div>

<div class="prompt">

<input id="user-input" placeholder="Ask Football AI..."
onkeypress="if(event.key==='Enter')sendMessage()">

<div class="send" onclick="sendMessage()">➤</div>

</div>

<div id="suggestions" class="suggestions"></div>

</div>

<div id="menu" class="dropdown">
<div onclick="renameChat()">Rename</div>
<div onclick="deleteChat()">Delete</div>
</div>

<script>

let chats=[]
let selectedIndex=null

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("collapsed")
}

function getDateTime(){
let now=new Date()
return now.toLocaleDateString()+" | "+now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
}

/* NEW CHAT FUNCTION */

function clearChat(){

const chatBox = document.getElementById("chat-box")
const suggestions = document.getElementById("suggestions")
const input = document.getElementById("user-input")

chatBox.innerHTML = ""
suggestions.innerHTML = ""
input.value = ""

chatBox.scrollTop = 0

}

function addMessage(text,type,datetime){

let box=document.getElementById("chat-box")

let msg=document.createElement("div")

msg.className="message "+type

msg.innerHTML=text+`<div class="msg-time">${datetime}</div>`

box.appendChild(msg)

box.scrollTop=box.scrollHeight
}

async function sendMessage(){

let input=document.getElementById("user-input")

let message=input.value.trim()

if(message==="") return

addMessage(message,"user",getDateTime())

input.value=""

const res=await fetch("/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message})
})

const data=await res.json()

addMessage(data.reply,"bot",getDateTime())

updateSuggestions(data.suggestions)
}

function suggest(text){

const input = document.getElementById("user-input")

input.value = text

sendMessage()

}

function updateSuggestions(list){

if(!list || list.length === 0) return

let box=document.getElementById("suggestions")

box.innerHTML=""

list.forEach(q=>{

if(!q || q.trim()==="") return

let div=document.createElement("div")

div.className="suggestion"

div.innerText=q

div.onclick=()=>{

document.getElementById("user-input").value=q

sendMessage()

}

box.appendChild(div)

})

}

function searchChats(){

let q=document.getElementById("searchChat").value.toLowerCase()

let items=document.querySelectorAll(".chat-item")

items.forEach(i=>{

if(i.innerText.toLowerCase().includes(q))
i.style.display="flex"
else
i.style.display="none"

})

}

let visible=false

async function toggleHistory(){

let list=document.getElementById("chatList")

if(visible){
list.style.display="none"
visible=false
return
}

const res=await fetch("/history")
chats=await res.json()

list.innerHTML=""

chats.forEach((chat,index)=>{

let item=document.createElement("div")
item.className="chat-item"

let title=document.createElement("div")
title.className="chat-title"
title.innerText=chat.user_message

title.onclick=function(){

document.getElementById("chat-box").innerHTML=""

addMessage(chat.user_message,"user",chat.date+" | "+chat.time)
addMessage(chat.bot_reply,"bot",chat.date+" | "+chat.time)

}

let menu=document.createElement("div")
menu.className="menu-btn"
menu.innerText="⋮"

menu.onclick=function(e){

e.stopPropagation()

selectedIndex=index

let dropdown=document.getElementById("menu")

dropdown.style.display="flex"
dropdown.style.left=e.pageX+"px"
dropdown.style.top=e.pageY+"px"

}

item.appendChild(title)
item.appendChild(menu)

list.appendChild(item)

})

list.style.display="block"

visible=true
}

async function deleteChat(){

let chat=chats[selectedIndex]

await fetch("/delete",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
user_message:chat.user_message,
time:chat.time
})
})

toggleHistory()
}

async function renameChat(){

let newName=prompt("Rename chat")

if(!newName) return

let chat=chats[selectedIndex]

await fetch("/rename",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
old_message:chat.user_message,
time:chat.time,
new_name:newName
})
})

toggleHistory()
}

</script>

</body>
</html>
